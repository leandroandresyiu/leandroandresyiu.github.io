<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pizarrón</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app">
	<header class="top">
		<button class="btn btn--icon" id="b-paginas" type="button" aria-pressed="false" aria-controls="paginas" title="Páginas, formato y fondo de la hoja"></button>
		<button class="btn btn--icon btn--compacto" id="b-opciones" type="button" aria-pressed="true" aria-controls="props" title="Mostrar u ocultar las opciones de la herramienta (color, grosor, estilo…)"></button>
		<input class="titulo" id="titulo" type="text" maxlength="80" spellcheck="false" autocomplete="off" aria-label="Nombre del pizarrón">
		<span class="grow"></span>
		<div class="grupo-top">
			<button class="btn btn--icon" id="b-deshacer" type="button" title="Deshacer (Ctrl+Z)" aria-label="Deshacer"></button>
			<button class="btn btn--icon" id="b-rehacer" type="button" title="Rehacer (Ctrl+Mayús+Z)" aria-label="Rehacer"></button>
		</div>
		<div class="grupo-top pager" id="pager">
			<button class="btn btn--icon" id="p-ant" type="button" title="Página anterior (RePág)" aria-label="Página anterior"></button>
			<span class="pager__n" id="p-num" role="status">1 / 1</span>
			<button class="btn btn--icon" id="p-sig" type="button" title="Página siguiente (AvPág)" aria-label="Página siguiente"></button>
			<button class="btn btn--icon" id="p-nueva" type="button" title="Agregar una página" aria-label="Agregar una página"></button>
		</div>
		<div class="grupo-top zoom" id="zoom">
			<button class="btn btn--icon" id="z-menos" type="button" title="Alejar (−)" aria-label="Alejar"></button>
			<button class="btn btn--chico" id="z-valor" type="button" title="Tamaño real / ajustar a la ventana">100%</button>
			<button class="btn btn--icon" id="z-mas" type="button" title="Acercar (+)" aria-label="Acercar"></button>
		</div>
		<button class="btn btn--icon" id="b-ajustar" type="button" title="Ajustar la hoja a la ventana" aria-label="Ajustar la hoja a la ventana"></button>
		<button class="btn btn--primario" id="b-archivo" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="menu-archivo" title="Guardar, abrir y exportar"><span class="ico-slot"></span><span class="txt">Archivo</span></button>
		<button class="btn btn--icon" id="b-ajustes" type="button" title="Ajustes del lápiz, del dedo y de la corrección de formas" aria-label="Ajustes"></button>
		<button class="btn btn--icon btn--info" id="b-info" type="button" title="Cómo se usa" aria-label="Cómo se usa">i</button>
	</header>

	<div class="props" id="props" role="toolbar" aria-label="Opciones de la herramienta"></div>

	<main class="mesa">
		<nav class="herr" id="herr" role="toolbar" aria-label="Herramientas" aria-orientation="vertical"></nav>
		<section class="lienzo" id="lienzo" aria-label="Hoja de dibujo">
			<canvas id="cv-base" aria-hidden="true"></canvas>
			<canvas id="cv-vivo" aria-label="Superficie para dibujar" role="img"></canvas>
			<textarea id="texto-ed" hidden spellcheck="false" aria-label="Texto" wrap="off"></textarea>
			<div class="aviso" id="aviso" role="status" aria-live="polite" hidden></div>
		</section>
		<aside class="paginas" id="paginas" hidden aria-label="Páginas"></aside>
	</main>
</div>

<div class="menu" id="menu-archivo" role="menu" hidden></div>
<div class="menu menu--formas" id="menu-formas" role="menu" hidden></div>

<dialog id="dlg-ajustes" class="dlg" aria-labelledby="t-ajustes"></dialog>
<dialog id="dlg-guardar" class="dlg" aria-labelledby="t-guardar"></dialog>
<dialog id="dlg-abrir" class="dlg" aria-labelledby="t-abrir"></dialog>
<dialog id="dlg-info" class="dlg dlg--ancho" aria-labelledby="t-info"></dialog>
<dialog id="dlg-circuito" class="dlg dlg--ancho" aria-labelledby="t-circuito"></dialog>

<input type="file" id="in-archivo" accept=".pizarron,.json,application/json" hidden>
<div id="host" aria-hidden="true"></div>

<script src="../compartido/vendor/jspdf.umd.min.js"></script>
<script src="../compartido/vendor/svg2pdf.umd.min.js"></script>
<script src="../compartido/vendor/fflate.umd.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
